[package]
name = "whisper-smart"
version = "0.5.2"
edition = "2021"
rust-version = "1.85"
description = "Hold-to-talk dictation for Windows desktops"
license = "MIT"
default-run = "whisper-smart"

[lib]
name = "whisper_smart"
path = "src/lib.rs"

[[bin]]
name = "whisper-smart"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[dependencies]
anyhow = "1.0.104"
arboard = "3.6.1"
base64 = "0.23.1"
cpal = "0.18.2"
crossbeam-channel = "0.5.16"
dirs = "6.0.0"
egui = "0.33.3"
hound = "3.5.1"
image = { version = "0.25.9", default-features = false, features = ["png"] }
notify-rust = "4.18"
once_cell = "1.21.4"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = { version = "3.4.0", default-features = false, features = ["gzip", "json", "native-tls"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.33.3", default-features = false, features = [
    "default_fonts",
    "glow",
] }
tray-icon = "0.21.1"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# The crate is Windows software, but it also builds on Unix development hosts
# (with stubbed platform integrations) so the portable core can be tested
# without a Windows machine. winit needs a windowing backend there.
[target.'cfg(not(windows))'.dependencies]
eframe = { version = "0.33.3", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }

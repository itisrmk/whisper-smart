[package]
name = "whisper-smart"
version = "0.4.2"
edition = "2021"
rust-version = "1.85"
description = "Hold-to-talk dictation for Linux desktops"
license = "MIT"
default-run = "whisper-smart"

[lib]
name = "whisper_smart"
path = "src/lib.rs"

[[bin]]
name = "whisper-smart"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
cpal = "0.18.2"
crossbeam-channel = "0.5.16"
dirs = "6.0.0"
evdev = "0.13.2"
gtk = { version = "0.11", package = "gtk4", features = ["v4_12"] }
hound = "3.5.1"
ksni = { version = "0.3.6", features = ["blocking"] }
layer-shell = { version = "0.8.1", package = "gtk4-layer-shell" }
notify-rust = "4.18"
once_cell = "1.21.4"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = { version = "3.4.0", features = ["json"] }

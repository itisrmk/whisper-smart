# One tag, both platforms.
#
# A release is a single `vX.Y.Z` tag that carries the macOS DMG and the Linux
# tarball, cut from the same commit. The two builds run in parallel and both
# must pass before anything is published: the tag, the appcast commit and the
# GitHub Release are all created by the final `publish` job, so a failed build
# on either platform leaves no half-finished release behind.
#
#   params ──┬── macos (signed, notarized DMG + appcast entry) ──┬── publish
#            └── linux (tested, versioned tarball) ──────────────┘
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number without v prefix (e.g. 0.5.0)"
        required: true
        type: string
      channel:
        description: "Release channel"
        required: true
        default: "beta"
        type: choice
        options:
          - beta
          - production
      checklist_confirmed:
        description: "I confirm the release checklist has been completed"
        required: true
        default: false
        type: boolean
      notes:
        description: "Release summary (prepended to the generated changelog)"
        required: false
        type: string
  # Auto-release: every merged PR into main cuts a beta release with an
  # auto-bumped patch version. Opt out per-PR with the `skip-release` label.
  # Bump minor/major instead with `release:minor` / `release:major` labels.
  # Docs/CI-only PRs (see paths-ignore) never trigger a release.
  pull_request:
    types: [closed]
    branches: [main]
    paths-ignore:
      - ".github/**"
      - "docs/**"
      - "site/**"
      - "**.md"
      - "appcast.xml"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Everything the platform builds need to agree on, resolved once so the two
  # of them cannot drift onto different versions.
  params:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       !contains(github.event.pull_request.labels.*.name, 'skip-release'))
    outputs:
      version: ${{ steps.params.outputs.version }}
      channel: ${{ steps.params.outputs.channel }}
      summary: ${{ steps.params.outputs.summary }}
      previous_tag: ${{ steps.params.outputs.previous_tag }}
      ref: ${{ steps.params.outputs.ref }}
    steps:
      - name: Enforce Release Checklist Confirmation
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.checklist_confirmed }}
        run: |
          echo "Checklist confirmation is required before tagging a release."
          echo "See docs/RELEASE.md."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # For merged-PR runs, release the tip of main (the merge result),
          # not the PR merge ref.
          ref: ${{ github.event_name == 'pull_request' && 'main' || github.ref }}
          fetch-depth: 0

      - name: Resolve Release Parameters
        id: params
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_NOTES: ${{ inputs.notes }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BUMP_MINOR: ${{ contains(github.event.pull_request.labels.*.name, 'release:minor') }}
          BUMP_MAJOR: ${{ contains(github.event.pull_request.labels.*.name, 'release:major') }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$INPUT_VERSION"
            CHANNEL="$INPUT_CHANNEL"
            SUMMARY="$INPUT_NOTES"
            REF="${GITHUB_REF}"
          else
            LATEST="$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
            LATEST="${LATEST#v}"
            IFS=. read -r MAJOR MINOR PATCH <<< "${LATEST:-0.0.0}"
            if [[ "$BUMP_MAJOR" == "true" ]]; then
              MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
            elif [[ "$BUMP_MINOR" == "true" ]]; then
              MINOR=$((MINOR + 1)); PATCH=0
            else
              PATCH=$((PATCH + 1))
            fi
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
            CHANNEL="beta"
            SUMMARY="${PR_TITLE} (#${PR_NUMBER})"
            REF="main"
            # Auto-bumped versions must never overwrite an existing release.
            # (Manual dispatch stays lenient: a pre-pushed tag is reused.)
            if git ls-remote --tags origin "v${VERSION}" | grep -q "v${VERSION}"; then
              echo "Tag v${VERSION} already exists on origin — refusing to re-release it."
              exit 1
            fi
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing to release with malformed version: '$VERSION'"
            exit 1
          fi
          PREVIOUS_TAG="$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^v${VERSION}$" | head -n 1 || true)"
          {
            echo "version=${VERSION}"
            echo "channel=${CHANNEL}"
            echo "previous_tag=${PREVIOUS_TAG}"
            echo "ref=${REF}"
            echo "summary<<SUMMARY_EOF"
            printf '%s\n' "$SUMMARY"
            echo "SUMMARY_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing v${VERSION} (${CHANNEL}) from ${REF} [trigger: ${EVENT_NAME}]"

  macos:
    needs: params
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.params.outputs.ref }}
          fetch-depth: 0

      - name: Release Gate
        env:
          VERSION: ${{ needs.params.outputs.version }}
          ALLOW_ADHOC_SIGNING: 1
        run: bash scripts/release_gate.sh

      - name: Validate Signing Certificate Secrets
        env:
          CERT_P12: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          for var_name in CERT_P12 CERT_PASSWORD; do
            value="${!var_name:-}"
            if [[ -z "$value" ]]; then
              echo "Missing required signing secret: $var_name"
              exit 1
            fi
          done

      - name: Validate Production Notarization Secrets
        if: ${{ needs.params.outputs.channel == 'production' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for var_name in APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            value="${!var_name:-}"
            if [[ -z "$value" ]]; then
              echo "Missing required production secret: $var_name"
              exit 1
            fi
          done

      - name: Import Signing Certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}

      - name: Build Signed DMG
        id: build
        env:
          VERSION: ${{ needs.params.outputs.version }}
          CHANNEL: ${{ needs.params.outputs.channel }}
        run: |
          set -euo pipefail
          IDENTITIES="$(security find-identity -v -p codesigning | grep -v 'CSSMERR' || true)"
          SIGNING_KIND="developer-id"
          SIGNING_IDENTITY="$(printf '%s\n' "$IDENTITIES" | grep 'Developer ID Application' | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/' || true)"
          if [[ -z "$SIGNING_IDENTITY" ]]; then
            # Fallback: an Apple Development certificate still provides a
            # stable signing identity (macOS TCC permission grants persist
            # across updates), unlike ad-hoc signing. It cannot be notarized,
            # so it is only allowed for the beta channel until a Developer ID
            # Application certificate is provisioned.
            SIGNING_KIND="development"
            SIGNING_IDENTITY="$(printf '%s\n' "$IDENTITIES" | grep 'Apple Development' | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/' || true)"
            if [[ -n "$SIGNING_IDENTITY" && "$CHANNEL" == "production" ]]; then
              echo "Production channel requires a Developer ID Application certificate; only an Apple Development identity is available."
              exit 1
            fi
          fi
          if [[ -z "$SIGNING_IDENTITY" ]]; then
            echo "No usable codesigning identity found after certificate import."
            exit 1
          fi
          echo "Signing with identity: $SIGNING_IDENTITY"
          CODESIGN_IDENTITY="$SIGNING_IDENTITY" VERSION="$VERSION" bash scripts/package_dmg.sh
          if [[ "$SIGNING_KIND" == "developer-id" ]]; then
            codesign --force --timestamp --sign "$SIGNING_IDENTITY" ".build/release/Whisper-Smart-mac.dmg"
          fi
          echo "signing_kind=${SIGNING_KIND}" >> "$GITHUB_OUTPUT"

      # Notarize every Developer ID-signed release, beta included — beta is
      # what the auto-release pipeline ships to end users, and an unnotarized
      # DMG is blocked by Gatekeeper on download.
      - name: Notarize DMG
        if: ${{ steps.build.outputs.signing_kind == 'developer-id' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for var_name in APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            value="${!var_name:-}"
            if [[ -z "$value" ]]; then
              echo "A Developer ID certificate is in use, so notarization is mandatory,"
              echo "but the required secret is missing: $var_name"
              echo "Add APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID repo secrets."
              exit 1
            fi
          done
          DMG_PATH=".build/release/Whisper-Smart-mac.dmg"
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          spctl --assess --type open --context context:primary-signature -v "$DMG_PATH"

      # Sparkle shows this in the updater window, so it gets the summary and
      # the changelog without the download table — it is already downloading
      # the DMG those links point at.
      - name: Update Appcast
        env:
          VERSION: ${{ needs.params.outputs.version }}
          CHANNEL: ${{ needs.params.outputs.channel }}
          SUMMARY: ${{ needs.params.outputs.summary }}
          PREVIOUS_TAG: ${{ needs.params.outputs.previous_tag }}
          REPOSITORY: ${{ github.repository }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          APP_PLIST=".build/release/Whisper Smart.app/Contents/Info.plist"
          DMG_PATH=".build/release/Whisper-Smart-mac.dmg"
          if [[ ! -f "$APP_PLIST" ]]; then
            echo "Missing built app plist at $APP_PLIST"
            exit 1
          fi
          if [[ ! -f "$DMG_PATH" ]]; then
            echo "Missing DMG at $DMG_PATH"
            exit 1
          fi

          BUILD_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PLIST")"
          SHORT_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PLIST")"
          if [[ "$SHORT_VERSION" != "$VERSION" ]]; then
            echo "App short version ($SHORT_VERSION) does not match requested release version ($VERSION)"
            exit 1
          fi

          NOTES_FILE="$(mktemp)"
          bash scripts/compose_release_notes.sh \
            --version "$VERSION" \
            --channel "$CHANNEL" \
            --previous-tag "$PREVIOUS_TAG" \
            --notes "$SUMMARY" \
            --repository "$REPOSITORY" \
            --format appcast > "$NOTES_FILE"

          DMG_LENGTH="$(stat -f%z "$DMG_PATH")"
          DMG_URL="https://github.com/${REPOSITORY}/releases/download/v${VERSION}/Whisper-Smart-mac.dmg"
          PUB_DATE="$(LC_ALL=C date -u '+%a, %d %b %Y %H:%M:%S +0000')"
          SIGN_TOOL=".build/artifacts/sparkle/Sparkle/bin/sign_update"
          if [[ ! -x "$SIGN_TOOL" ]]; then
            echo "Missing Sparkle sign_update tool at $SIGN_TOOL"
            exit 1
          fi
          if [[ -z "${SPARKLE_PRIVATE_KEY:-}" ]]; then
            echo "Missing required secret: SPARKLE_PRIVATE_KEY"
            exit 1
          fi
          ED_SIGNATURE="$(printf '%s' "$SPARKLE_PRIVATE_KEY" | "$SIGN_TOOL" --ed-key-file - -p "$DMG_PATH" | tr -d '\n')"
          if [[ -z "$ED_SIGNATURE" ]]; then
            echo "Failed to generate Sparkle edSignature for $DMG_PATH"
            exit 1
          fi

          bash scripts/update_appcast.sh \
            --version "$VERSION" \
            --build-version "$BUILD_VERSION" \
            --dmg-url "$DMG_URL" \
            --dmg-length "$DMG_LENGTH" \
            --ed-signature "$ED_SIGNATURE" \
            --notes-file "$NOTES_FILE" \
            --pub-date "$PUB_DATE" \
            --output "appcast.xml"

      - name: Verify Appcast
        run: bash scripts/verify_appcast.sh appcast.xml

      # The DMG and the appcast travel to `publish`, which owns every push.
      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            .build/release/Whisper-Smart-mac.dmg
            appcast.xml
          if-no-files-found: error
          retention-days: 7

  linux:
    needs: params
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Built on Arch rather than the runner's Ubuntu: the binary links GTK 4 and
    # gtk4-layer-shell dynamically, so it is tied to the versions it was built
    # against, and Arch is both the primary target and the distro the AUR
    # package serves. Everyone else builds from source via packaging/install.sh.
    container: archlinux:base-devel
    steps:
      - name: Install build dependencies
        # Runs before checkout because the container has no git, which
        # actions/checkout needs in order to do a real clone.
        run: |
          pacman -Syu --noconfirm --needed \
            git rust pkgconf python \
            gtk4 gtk4-layer-shell alsa-lib libpulse

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.params.outputs.ref }}
          fetch-depth: 0

      - name: Stamp Version
        env:
          VERSION: ${{ needs.params.outputs.version }}
        run: bash linux/packaging/set-version.sh "$VERSION"

      - name: QA Smoke
        working-directory: linux
        run: bash scripts/run_qa_smoke.sh

      - name: Build Tarball
        working-directory: linux
        env:
          VERSION: ${{ needs.params.outputs.version }}
        run: bash packaging/make-tarball.sh

      - name: Verify Version Stamp
        working-directory: linux
        env:
          VERSION: ${{ needs.params.outputs.version }}
        run: |
          set -euo pipefail
          REPORTED="$(./target/release/whisper-smart --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)"
          if [[ "$REPORTED" != "$VERSION" ]]; then
            echo "Built binary reports $REPORTED but the release is $VERSION"
            exit 1
          fi
          echo "Linux binary reports $REPORTED"

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            linux/dist/*.tar.gz
            linux/dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  # Nothing is pushed until both platforms have built. This job owns the
  # appcast commit, the version bump, the tag and the release itself.
  publish:
    needs: [params, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.params.outputs.ref }}
          fetch-depth: 0

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage Release Commit
        env:
          VERSION: ${{ needs.params.outputs.version }}
        run: |
          set -euo pipefail
          cp artifacts/macos-release/appcast.xml appcast.xml
          # Same stamp the Linux build used, so the committed manifest matches
          # the binary that shipped.
          bash linux/packaging/set-version.sh "$VERSION"

      - name: Compose Release Notes
        id: notes
        env:
          VERSION: ${{ needs.params.outputs.version }}
          CHANNEL: ${{ needs.params.outputs.channel }}
          SUMMARY: ${{ needs.params.outputs.summary }}
          PREVIOUS_TAG: ${{ needs.params.outputs.previous_tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          bash scripts/compose_release_notes.sh \
            --version "$VERSION" \
            --channel "$CHANNEL" \
            --previous-tag "$PREVIOUS_TAG" \
            --notes "$SUMMARY" \
            --repository "$REPOSITORY" > "$NOTES_FILE"
          echo "path=${NOTES_FILE}" >> "$GITHUB_OUTPUT"
          cat "$NOTES_FILE"

      - name: Commit Release Bookkeeping
        env:
          VERSION: ${{ needs.params.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml linux/Cargo.toml linux/Cargo.lock linux/packaging/PKGBUILD linux/packaging/aur/whisper-smart/PKGBUILD
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore(release): appcast and version for v${VERSION}"
            git pull --rebase origin main
            # Keep legacy Sparkle clients (old SUFeedURL -> master) updating.
            git push origin HEAD:main HEAD:master
          fi

      - name: Create and Push Tag
        env:
          VERSION: ${{ needs.params.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if git ls-remote --tags origin "${TAG}" | grep -q "${TAG}"; then
            echo "Tag ${TAG} already exists on origin."
          else
            git tag "${TAG}"
            git push origin "${TAG}"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.params.outputs.version }}
          name: v${{ needs.params.outputs.version }}
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            artifacts/macos-release/Whisper-Smart-mac.dmg
            artifacts/macos-release/appcast.xml
            artifacts/linux-release/*.tar.gz
            artifacts/linux-release/*.tar.gz.sha256

      # The AUR stable package builds from the tag tarball, so its checksum can
      # only be computed once the tag exists. Doing it here keeps the packaging
      # in the repo release-ready instead of leaving a manual `updpkgsums`.
      - name: Sync AUR Checksum
        env:
          VERSION: ${{ needs.params.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          PKGBUILD="linux/packaging/aur/whisper-smart/PKGBUILD"
          URL="https://github.com/${REPOSITORY}/archive/refs/tags/v${VERSION}.tar.gz"
          curl -fsSL --retry 3 --retry-delay 5 -o "${RUNNER_TEMP}/src.tar.gz" "$URL"
          SUM="$(sha256sum "${RUNNER_TEMP}/src.tar.gz" | cut -d' ' -f1)"
          sed -i -E "s/^sha256sums=\(.*\)$/sha256sums=('${SUM}')/" "$PKGBUILD"
          if git diff --quiet -- "$PKGBUILD"; then
            echo "AUR checksum already current."
            exit 0
          fi
          git add "$PKGBUILD"
          git commit -m "chore(release): sync AUR checksum for v${VERSION}"
          git pull --rebase origin main
          git push origin HEAD:main

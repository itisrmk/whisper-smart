# Every platform, every PR — the same builds the release runs, so a green
# PR means all three parts of a release can be cut from it.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift Version
        run: swift --version

      - name: Verify Appcast
        run: bash scripts/verify_appcast.sh appcast.xml

      - name: Typecheck
        run: bash scripts/typecheck.sh

      - name: QA Smoke
        run: bash scripts/run_qa_smoke.sh

      - name: Visual Regression
        run: bash scripts/run_visual_regression.sh

      - name: Build Release
        run: swift build -c release

  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Arch, matching the release build: the GTK 4 and gtk4-layer-shell versions
    # the binary links against are the ones the shipped artifact links against.
    container: archlinux:base-devel
    steps:
      - name: Install build dependencies
        # Before checkout: the container has no git, which actions/checkout
        # needs in order to do a real clone.
        run: |
          pacman -Syu --noconfirm --needed \
            git rust pkgconf python shellcheck \
            gtk4 gtk4-layer-shell alsa-lib libpulse

      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust Version
        run: rustc --version

      - name: QA Smoke
        working-directory: linux
        run: bash scripts/run_qa_smoke.sh

      - name: Build Release
        working-directory: linux
        run: cargo build --release --locked

      - name: Package Tarball
        working-directory: linux
        run: SKIP_BUILD=1 bash packaging/make-tarball.sh

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust Version
        run: rustc --version

      - name: QA Smoke
        working-directory: windows
        run: bash scripts/run_qa_smoke.sh

      - name: Build Release
        working-directory: windows
        run: cargo build --release --locked

      - name: Package Zip
        working-directory: windows
        run: SKIP_BUILD=1 bash packaging/make-zip.sh

      # Uploaded so a PR build can be downloaded and tested on a real Windows
      # machine before anything is merged or released.
      - name: Upload Windows Zip
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: |
            windows/dist/*.zip
            windows/dist/*.zip.sha256
          if-no-files-found: error
          retention-days: 7
